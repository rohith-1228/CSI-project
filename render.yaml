services:
  - type: web
    name: cybersaathi-backend
    env: python
    buildCommand: pip install -r requirements.txt && python backend/scripts/train_model.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_MESSAGE_LENGTH
        value: "5000"
      - key: MODEL_PATH
        value: models/cybersaathi_text_classifier_v1.joblib
      - key: MODEL_METADATA_PATH
        value: models/model_metadata.json
